version: 2

sources:
  - name: jaffle_shop
    database: dbt-tutorial
    schema: jaffle_shop
    config:
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 1
          period: day
      loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        freshness: null
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: first_name
            data_tests:
              - not_null
          - name: last_name
            data_tests:
              - not_null
      - name: orders
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: user_id
            data_tests:
              - not_null
              - relationships:
                  to: ref('stg_jaffle_shop__customer_orders')
                  field: customer_id
          - name: order_date
            data_tests:
              - not_null
          - name: status
            data_tests:
              - accepted_values:
                  values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
version: 2

sources:
  - name: jaffle_shop
    description: A clone of a Postgres database
    database: dbt-tutorial
    schema: jaffle_shop
    config:
      freshness:
        warn_after:
          count: 12
          period: hour
        error_after:
          count: 1
          period: day
      loaded_at_field: _etl_loaded_at
    tables:
      - name: customers
        description: Raw customer data
        freshness: null
        columns:
          - name: id
            description: Primary key
            data_tests:
              - unique
              - not_null
          - name: first_name
            data_tests:
              - not_null
          - name: last_name
            data_tests:
              - not_null
      - name: orders
        description: Raw order data
        columns:
          - name: id
            description: Primary key
            data_tests:
              - unique
              - not_null
          - name: user_id
            description: Foreign key, Primary key of source Jaffle_shop Customers
            data_tests:
              - not_null
              - relationships:
                  to: ref('stg_jaffle_shop__customers')
                  field: customer_id
          - name: order_date
            data_tests:
              - not_null
          - name: status
            description: "{{ doc('orders__status') }}"
            data_tests:
              - accepted_values:
                  values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
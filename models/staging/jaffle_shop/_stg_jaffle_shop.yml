models:
  - name: stg_jaffle_shop__customers
    description: One customer per row
    columns:
      - name: customer_id
        description: Primary key
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
  - name: stg_jaffle_shop__orders
    description: One order per row
    columns:
      - name: order_id
        description: Primary key
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key, Primary key of ref Jaffle_shop Customers
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
      - name: order_date
        data_tests:
          - not_null
      - name: status
        description: "{{ doc('orders__status') }}"
        data_tests:
          - accepted_values:
              values: ['completed', 'placed', 'return_pending', 'returned', 'shipped']
  - name: stg_jaffle_shop__customer_orders
    description: One customer per row
    columns:
      - name: customer_id
        description: Primary and Foreign key, Primary key of ref Jaffle_shop Customers
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_jaffle_shop__customers')
              field: customer_id
      - name: first_order_date
        data_tests:
          - not_null
      - name: most_recent_order_date
        data_tests:
          - not_null
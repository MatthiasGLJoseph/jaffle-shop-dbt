models:
  - name: stg_stripe__payments
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_jaffle_shop__orders')
              field: order_id
      - name: payment_method
        data_tests:
          - accepted_values:
              values: ['bank_transfer', 'coupon', 'credit_card', 'gift_card']
      - name: status
        data_tests:
          - accepted_values:
              values: ['fail', 'success']
      - name: created_at
        data_tests:
          - not_null
  - name: stg_stripe__order_payments
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_jaffle_shop__orders')
              field: order_id